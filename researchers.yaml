# Beobachtete Personen für den täglichen Publikations-Check.
# Quelle: BigBrains-Liste (dedupliziert; Kategorien als Tags zusammengeführt).
#
# Format je Eintrag:
#   name:             Anzeigename, wird auch als Suchanfrage verwendet
#   aliases:          weitere Schreibweisen (zusätzliche Suchanfragen + Namensabgleich),
#                     z. B. Varianten mit mittlerem Initial ("Quoc V. Le")
#   categories:       Tags, nur für die Gruppierung im Report
#   sources:          Teilmenge von [arxiv, openalex]; Standard: beide.
#                     Bei sehr häufigen Namen lohnt es sich, auf arxiv zu beschränken.
#   arxiv_categories: Präfix-Filter für arXiv-Kategorien (z. B. ["cs.", "stat."]),
#                     reduziert Fehltreffer bei Namensgleichheit
#   openalex_id:      OpenAlex-Autoren-ID (z. B. A5023888391) für exakte Zuordnung statt
#                     Namenssuche – zu finden über https://api.openalex.org/authors?search=Vorname+Nachname
#   enabled:          false, um eine Person zu pausieren (Standard: true)
#
# Diakritika werden automatisch normalisiert (auch als zusätzliche Suchvariante
# verwendet), mittlere Namen/Initialen werden beim Abgleich ignoriert.
# Abgekürzte Vornamen ("J. Wei") werden bewusst NICHT akzeptiert, um Fehltreffer
# bei häufigen Nachnamen zu vermeiden.

